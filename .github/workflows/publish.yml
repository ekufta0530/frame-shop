name: build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SITE_IMAGE: ghcr.io/${{ github.repository }}-site

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - name: Website frontend - type-check, lint, test, build
        working-directory: webapp/frontend
        run: |
          npm ci
          npm run check
          npm run build

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3   # docker-container driver: needed for gha cache export

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # the website, which is also the MCP server for Claude (webapp/mcp_server.py)
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: webapp/Dockerfile
          push: true
          platforms: linux/amd64   # Cloud Run runs amd64
          tags: |
            ${{ env.SITE_IMAGE }}:latest
            ${{ env.SITE_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=site
          cache-to: type=gha,mode=max,scope=site

  # ---- deploy: push to main -> roll the website onto the new image ----------
  # Authenticates to GCP with Workload Identity Federation (keyless); one-time
  # setup + the GCP_WIF_PROVIDER / GCP_DEPLOY_SA repo variables are in
  # cloud/DEPLOY.md.

  deploy-site:
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: frame-shop-511616
      # webapp/deploy.sh creates the service on first run; after that this just rolls the image
      - name: Deploy to Cloud Run
        run: |
          gcloud run services update frame-shop \
            --region=us-west1 \
            --image=${{ env.SITE_IMAGE }}:sha-${{ github.sha }}
      - name: Smoke-check /health
        run: |
          URL=$(gcloud run services describe frame-shop \
            --region=us-west1 --format='value(status.url)')
          curl -sf "$URL/health"
